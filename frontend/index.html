<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> COSEC Copilot</title>
  <link rel="icon" href="./public/Matrix-ComSec_Logo (1).png" type="image/png">
  <link rel="stylesheet" href="css/app.css?v=7" />
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
  <div class="header-left">
    <img class="logo-img" src="./public/Matrix-ComSec_Logo (1).png" alt="Matrix ComSec" />
    <div>
      <div class="header-title">COSEC Copilot</div>
      <div class="header-sub">Panel Assistant</div>
    </div>
  </div>
  <div class="header-right">
    <div class="badge" id="pendingBadge" style="display:none">
      <div class="dot pending-dot"></div>
      <span>Awaiting answer</span>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle light/dark mode" onclick="toggleTheme()">☀️</button>
    <button class="icon-btn" title="Clear chat" onclick="clearChat()">🗑</button>
  </div>
</div>

<!-- ── MAIN AREA ── -->
<div class="main-area">

  <!-- ── SIDEBAR ── -->
  <div class="sidebar" id="sidebar">

    <div class="sb-section">
      <div class="sb-section-title">User Manual</div>
      <button class="sb-btn" onclick="sendSuggestion('What can I do?')">❓ What can I do?</button>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-section">
      <div class="sb-section-title">Learn Operations</div>
      <button class="sb-btn" onclick="sendSuggestion('What is add user?')">📖 Add User</button>
      <button class="sb-btn" onclick="sendSuggestion('What is delete user?')">📖 Delete User</button>
      <button class="sb-btn" onclick="sendSuggestion('What is get user?')">📖 Get User</button>
      <button class="sb-btn" onclick="sendSuggestion('What is enroll user?')">📖 Enroll User</button>
      <button class="sb-btn" onclick="sendSuggestion('What is get door configuration?')">📖 Get Door Config</button>
      <button class="sb-btn" onclick="sendSuggestion('What is set door configuration?')">📖 Set Door Config</button>
    </div>

 

    <div class="sb-divider"></div>

    <div class="sb-section">
      <div class="sb-section-title">Quick Actions</div>
      <button class="sb-btn" onclick="sendSuggestion('Add user Jay with id 101')">➕ Add User</button>
      <button class="sb-btn" onclick="sendSuggestion('Delete user with id 5')">🗑️ Delete User</button>
      <button class="sb-btn" onclick="sendSuggestion('Enroll user 5 on door 1')">👤 Enroll User</button>
      <button class="sb-btn" onclick="sendSuggestion('Get door configuration with pid 1')">🚪 Get Door Config</button>
      <button class="sb-btn" onclick="sendSuggestion('Set door configuration door name argo and door-type argo face/vega , ip adress 192.168.103.184 and mac address 00:1b:09:16:23:24')">⚙️ Set Door Config</button>
      
    </div>

  </div>

  <!-- ── CHAT PANEL ── -->
  <div class="chat-panel">

    <!-- ── CHAT ── -->
    <div class="chat-wrap" id="chatWrap">
      <div class="chat-inner" id="chatInner">

        <!-- Welcome screen (removed by ui.js on first message) -->
        <div class="welcome" id="welcome">
          <img class="logo-img" src="./public/Matrix-ComSec_Logo (1).png" alt="Matrix ComSec" />
          <div class="welcome-title">COSEC Copilot</div>
        </div>

      </div>
    </div>

    <!-- ── INPUT ── -->
    <div class="input-area">
      <div class="input-inner">
        <div class="pending-banner" id="pendingBanner">
          ⏳ <strong>Follow-up:</strong> type your answer — or type a new command to start fresh
        </div>
        <div class="input-row">
          <div class="textarea-wrap">
            <textarea
              id="inputBox"
              rows="1"
              placeholder="Type a command…"
              onkeydown="handleKey(event)"
              oninput="resize(this)"
            ></textarea>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            Send <span>↑</span>
          </button>
        </div>
        <div class="hint-row">
          <span>Enter to send &nbsp;·&nbsp; Shift+Enter for new line</span>
          <span id="charCount"></span>
        </div>
      </div>
    </div>

  </div><!-- /.chat-panel -->

</div><!-- /.main-area -->

<!-- Load order matters: config → api → response_codes → ui → app -->
<script src="js/config.js?v=7"></script>
<script src="js/api.js?v=7"></script>
<script src="js/response_codes.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/app.js?v=7"></script>

</body>
</html>
